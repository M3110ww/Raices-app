# Render inyecta el puerto en la variable PORT; en local se usa 8080.
server.port=${PORT:8080}

# Las tablas de iteraciones comprimen muy bien.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Del actuator solo interesa health, que es lo que consulta Render.
management.endpoints.web.exposure.include=health

# Origenes autorizados para CORS. En Render se pone la URL de Vercel.
app.cors.origenes=${CORS_ORIGENES:*}

spring.application.name=raices
