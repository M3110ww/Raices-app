# Blueprint de Render para el backend Java.
# En Render: New -> Blueprint -> elegir este repositorio.
services:
  - type: web
    name: raices-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/salud
    envVars:
      # Mientras no se despliegue el frontend vale cualquier origen. Una vez
      # publicado en Vercel, hay que cambiarlo por su URL exacta,
      # por ejemplo https://raices-app.vercel.app
      - key: CORS_ORIGENES
        value: "*"
